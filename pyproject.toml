[project]
name = "bitbit-agent"
version = "0.1.0"
description = "bitbit-agent — voice agent on Pipecat (DeepSeek Flash + Whisper + Kokoro)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[whisper,mlx-whisper,kokoro,silero,daily,runner,webrtc]>=0.0.95",
    "python-dotenv>=1.0.0",
    "num2words>=0.5.14",
    "pydantic>=2.11.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
bitbit = "app.pipecat_runtime.bot:main"
bitbit-pipecat = "app.pipecat_runtime.bot:main"

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
