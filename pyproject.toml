[project]
name = "bitbit-agent"
version = "0.1.0"
description = "Voice agent for medical appointment scheduling on Pipecat"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pipecat-ai[whisper,silero,runner,webrtc]==1.11.0",
    "python-dotenv>=1.0.0",
    "num2words>=0.5.14",
    "pydantic>=2.11.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
mac = [
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio==0.5.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "parakeet-mlx==0.5.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
bitbit = "app.pipecat_runtime.bot:main"
bitbit-pipecat = "app.pipecat_runtime.bot:main"

[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["flow_graph/specs/*.json", "kb/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
